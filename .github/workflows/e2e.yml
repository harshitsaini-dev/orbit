name: E2E

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    runs-on: ubuntu-latest
    # A ceiling, because the default is six hours and a hung suite will happily
    # use them. One run sat in_progress for over an hour on specs that failed on
    # a link the mobile layout does not have: a sixty-second test timeout and
    # two retries turn a handful of bad selectors into a very long afternoon.
    #
    # Thirty-five rather than twenty-five. The specs are fixed and the config
    # runs two workers now, but the honest number is what the job actually
    # needs - checkout, npm ci, a browser download and four hundred specs - not
    # what looks tidy. Twenty-five cancelled two healthy runs.
    timeout-minutes: 35
    # The Playwright config owns the servers' environment (hosted mode, dev
    # outbox, dedicated ports), so nothing needs setting here.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Headless in CI only; local runs use `npm run test:e2e` (headed) so the
      # browser is visible while it works.
      - name: Run E2E suite
        run: npm run test:e2e:ci

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
