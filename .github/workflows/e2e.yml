name: E2E

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    runs-on: ubuntu-latest
    # A ceiling, because the default is six hours and a hung suite will happily
    # use them. One run sat in_progress for over an hour on a spec that failed
    # on a link the mobile layout does not have: one worker, sixty-second test
    # timeout and two retries turn a handful of bad selectors into a very long
    # afternoon. Twenty-five minutes is comfortably above a healthy run and far
    # below a wasted one.
    timeout-minutes: 25
    # The Playwright config owns the servers' environment (hosted mode, dev
    # outbox, dedicated ports), so nothing needs setting here.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Headless in CI only; local runs use `npm run test:e2e` (headed) so the
      # browser is visible while it works.
      - name: Run E2E suite
        run: npm run test:e2e:ci

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
