# The API, as a blueprint rather than as settings typed into a dashboard.
#
# Two things here are easy to get wrong by hand and are the reason this file
# exists. The build has to include the web workspace, because the share page's
# viewer is built from it into the server; and the health check has to be the
# readiness route, not /health - the cheap one answers "ok" from memory and
# would keep saying so with the database unreachable, which is exactly the
# state traffic must not be sent into.
#
# Secrets are `sync: false`: Render prompts for them once and never stores them
# in the repository.

services:
  - type: web
    name: orbit-api
    runtime: node
    plan: free
    # Nearest free region to the people using this.
    region: singapore
    branch: main

    # Two things about this line, both learned the hard way.
    #
    # `--include=dev`, because NODE_ENV is production here and npm then omits
    # devDependencies - which is where TypeScript, Vite and, more to the point,
    # the `tsx` this service is *started* with all live. Without it the build
    # fails on a missing type definition, and had it not, the start command
    # would have failed on a missing binary.
    #
    # And the web workspace, because the share page's viewer is built from it
    # into the server: `npm ci` alone deploys an API whose share links fall
    # back to the plain preview.
    buildCommand: npm ci --include=dev && npm run build -w @orbit/web
    startCommand: npm start -w @orbit/server

    healthCheckPath: /health/ready

    envVars:
      - key: NODE_ENV
        value: production
      # Refused at boot in production if this is anything else: local mode has
      # no sign-in at all.
      - key: AUTH_MODE
        value: hosted
      - key: APP_URL
        value: https://orbit.harshitsaini.in
      - key: API_URL
        value: https://api.orbit.harshitsaini.in
      # The shared parent, so the session cookie is sent to both subdomains.
      - key: COOKIE_DOMAIN
        value: .harshitsaini.in
      - key: SYNC_CRON
        value: '*/15 * * * *'

      - key: DATABASE_URL
        sync: false
      - key: DATABASE_AUTH_TOKEN
        sync: false
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      # Orbit's own sending subdomain, separate from anything else on this
      # Resend account: a deliverability problem with one project's mail then
      # cannot touch another's.
      - key: RESEND_FROM
        value: Orbit <no-reply@signal.harshitsaini.in>

      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: DROPBOX_CLIENT_ID
        sync: false
      - key: DROPBOX_CLIENT_SECRET
        sync: false
      - key: ONEDRIVE_CLIENT_ID
        sync: false
      - key: ONEDRIVE_CLIENT_SECRET
        sync: false
      - key: PCLOUD_CLIENT_ID
        sync: false
      - key: PCLOUD_CLIENT_SECRET
        sync: false
