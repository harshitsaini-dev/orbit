# The API, as a blueprint rather than as settings typed into a dashboard.
#
# Two things here are easy to get wrong by hand and are the reason this file
# exists. The build has to include the web workspace, because the share page's
# viewer is built from it into the server; and the health check has to be the
# readiness route, not /health - the cheap one answers "ok" from memory and
# would keep saying so with the database unreachable, which is exactly the
# state traffic must not be sent into.
#
# Secrets are `sync: false`: Render prompts for them once and never stores them
# in the repository.

services:
  - type: web
    name: orbit-api
    runtime: node
    plan: free
    # Nearest free region to the people using this.
    region: singapore
    branch: main

    # `npm ci` alone would start a server whose share pages have no viewer.
    buildCommand: npm ci && npm run build -w @orbit/web
    startCommand: npm start -w @orbit/server

    healthCheckPath: /health/ready

    envVars:
      - key: NODE_ENV
        value: production
      # Refused at boot in production if this is anything else: local mode has
      # no sign-in at all.
      - key: AUTH_MODE
        value: hosted
      - key: APP_URL
        value: https://orbit.harshitsaini.in
      - key: API_URL
        value: https://api.orbit.harshitsaini.in
      # The shared parent, so the session cookie is sent to both subdomains.
      - key: COOKIE_DOMAIN
        value: .harshitsaini.in
      - key: SYNC_CRON
        value: '*/15 * * * *'

      - key: DATABASE_URL
        sync: false
      - key: DATABASE_AUTH_TOKEN
        sync: false
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        value: Orbit <no-reply@signal.harshitsaini.in>

      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: DROPBOX_CLIENT_ID
        sync: false
      - key: DROPBOX_CLIENT_SECRET
        sync: false
      - key: ONEDRIVE_CLIENT_ID
        sync: false
      - key: ONEDRIVE_CLIENT_SECRET
        sync: false
      - key: PCLOUD_CLIENT_ID
        sync: false
      - key: PCLOUD_CLIENT_SECRET
        sync: false
